# 终端界面替换默认 web UI 的 profile overlay（v4，DSH 0.1.1-rc.1 行 id 已核对）。
#
# 组合模型：外壳 @deepseek-ai/dsh-client-runtime 内置 'root' 单槽；本 overlay
# 禁掉默认 UI 行后由 @deepseek-ai/dsh-client-tonghuashun 接管 root。
#   - ui-theme / locale / ui-settings / ui-renderer 保持启用（服务提供者 /
#     slot renderer 安装者；禁掉会卡 boot 或无法渲染 root）；
#   - session-log-download 禁用（其客户端半注入默认 UI 的服务）；
#   - ui-cordis 禁用：它依赖 ui-input-trigger 的 inputTriggers 服务，而
#     ui-input-trigger 被禁后它永远 pending，会触发 web boot 审计报错；
#   - ui-brand-official / ui-attachment / ui-reference 禁用：它们注册进
#     ui-layout / ui-conversation 声明的子槽，默认 UI 行被禁后这些槽不存在，
#     直接注册会报 undeclared slot。
#
# 用法（安装 @deepseek-ai/dsh-client-tonghuashun 之后）：
#   1. 把这些行合并进 profile 的用户层 patch（~/.dsh/profiles/<p>/cordis.patch.yml），
#   2. 重启 dsh web —— 终端界面注册 'root' 槽，默认 web UI 行被禁用。
#
# 快照升级后若 web-app 的 UI 行 id 变化，用 --dump-config 核对并同步。

- id: ui-layout
  disabled: true
- id: ui-sidebar
  disabled: true
- id: ui-conversation
  disabled: true
- id: ui-tool
  disabled: true
- id: ui-trajectory
  disabled: true
- id: ui-workspace
  disabled: true
- id: ui-workflow-run
  disabled: true
- id: ui-deliverables
  disabled: true
# ui-settings 保持启用（settingsScope 服务提供者）
- id: ui-settings-general
  disabled: true
- id: ui-settings-models
  disabled: true
- id: ui-settings-plugin-inventory
  disabled: true
- id: ui-settings-plugins
  disabled: true
- id: ui-commands
  disabled: true
- id: ui-input-trigger
  disabled: true
- id: ui-message-feedback
  disabled: true
- id: ui-jobs
  disabled: true
- id: ui-skill
  disabled: true
- id: ui-subagent
  disabled: true
- id: ui-goal
  disabled: true
- id: ui-model-selection
  disabled: true
- id: ui-permission
  disabled: true
- id: ui-agent-preset
  disabled: true
- id: ui-plan
  disabled: true
- id: ui-user-questions
  disabled: true
- id: ui-cordis
  disabled: true
- id: ui-brand-official
  disabled: true
- id: ui-attachment
  disabled: true
- id: ui-reference
  disabled: true
- id: session-log-download
  disabled: true
